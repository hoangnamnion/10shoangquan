<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Welcome • Locket Gold</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#0b0f1a;
    --pink:#f9a8d4;
    --pink-glow:rgba(249,168,212,.6);
    --blue:#93c5fd;
    --blue-glow:rgba(147,197,253,.5);
    --text:#fdf2f8;
    --muted:#fbcfe8;
    --card-bg:rgba(255,255,255,.06);
    --border:rgba(255,255,255,.15);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color: transparent;
}

body{
    min-height:100vh;
    font-family:Inter,sans-serif;
    background:
      radial-gradient(min(70vw, 600px) min(40vh, 300px) at 50% -5%, #312e81 0%, transparent 70%),
      radial-gradient(min(60vw, 500px) min(30vh, 250px) at 80% 20%, #831843 0%, transparent 70%),
      var(--bg);
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    overflow-x: hidden;
}

/* CARD */
.card{
    width:100%;
    max-width:min(92vw, 420px);
    padding:clamp(28px, 6vw, 36px) clamp(20px, 4vw, 26px);
    text-align:center;
    background:var(--card-bg);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border:1px solid var(--border);
    border-radius:26px;
    box-shadow:
      0 8px 32px rgba(0,0,0,.3),
      0 0 0 1px rgba(255,255,255,.05),
      inset 0 0 0 1px rgba(255,255,255,.05);
    animation:fadeIn .7s ease-out;
    position:relative;
}

.card::before{
    content:'';
    position:absolute;
    top:0;
    left:0;
    right:0;
    bottom:0;
    border-radius:26px;
    background:linear-gradient(135deg, rgba(249,168,212,.1), rgba(147,197,253,.1) 100%);
    pointer-events:none;
}

/* TEXT */
h1{
    font-size:clamp(1.6rem, 5vw, 1.9rem);
    font-weight:700;
    color:var(--pink);
    text-shadow:0 0 20px var(--pink-glow);
    margin-bottom:8px;
    line-height:1.3;
}

p{
    margin-top:12px;
    font-size:clamp(0.85rem, 3vw, 0.95rem);
    color:var(--muted);
    line-height:1.6;
    opacity:0.9;
}

/* EMOJI DECORATION */
.emoji{
    font-size:clamp(2rem, 6vw, 2.5rem);
    display:block;
    margin:clamp(12px, 3vw, 16px) auto;
    animation:float 3s ease-in-out infinite;
}

/* BUTTON GROUP */
.button-group{
    display:grid;
    grid-template-columns:1fr;
    gap:clamp(14px, 4vw, 18px);
    margin-top:clamp(24px, 6vw, 32px);
}

/* BUTTON STYLES */
.btn{
    width:100%;
    padding:clamp(14px, 4vw, 16px);
    font-size:clamp(0.95rem, 3.5vw, 1rem);
    font-weight:700;
    border:none;
    border-radius:999px;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    transition:all 0.3s ease;
    touch-action:manipulation;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
}

.btn::after{
    content:'';
    position:absolute;
    top:0;
    left:-100%;
    width:100%;
    height:100%;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.2), transparent);
    transition:left 0.5s;
}

.btn:hover::after{
    left:100%;
}

.btn:active{
    transform:scale(0.96);
    animation:none;
}

/* PINK BUTTON (CẤU HÌNH) - GIỜ LÊN TRÊN */
.btn-pink{
    color:#831843;
    background:linear-gradient(135deg,#fce7f3,#f9a8d4);
    box-shadow:0 4px 20px var(--pink-glow);
    animation:pulsePink 2.2s infinite;
    order:1; /* Đặt lên trên */
}

.btn-pink:active{
    box-shadow:0 2px 15px var(--pink-glow);
}

/* BLUE BUTTON (APP) - GIỜ XUỐNG DƯỚI */
.btn-blue{
    color:#1e40af;
    background:linear-gradient(135deg,#dbeafe,#93c5fd);
    box-shadow:0 4px 20px var(--blue-glow);
    animation:pulseBlue 2.2s infinite 0.5s;
    order:2; /* Đặt xuống dưới */
}

.btn-blue:active{
    box-shadow:0 2px 15px var(--blue-glow);
}

/* BUTTON ICONS */
.btn-icon{
    font-size:1.2em;
}

/* LOADING INDICATOR */
.loading{
    display:none;
    margin-top:12px;
    font-size:0.85rem;
    color:var(--muted);
    opacity:0.8;
    grid-column:1/-1;
    order:3; /* Đặt cuối cùng */
}

/* STEP INDICATOR */
.steps{
    margin-top:clamp(20px, 5vw, 28px);
    padding:clamp(16px, 4vw, 20px);
    background:rgba(255,255,255,.05);
    border-radius:18px;
    border:1px solid rgba(255,255,255,.1);
    text-align:left;
}

.step{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:12px;
    font-size:0.9rem;
}

.step:last-child{
    margin-bottom:0;
}

.step-number{
    min-width:24px;
    height:24px;
    background:var(--pink);
    color:#831843;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    font-size:0.8rem;
}

/* ANIMATIONS */
@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px) scale(0.98);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

@keyframes pulsePink{
    0%, 100%{
        box-shadow:0 4px 20px var(--pink-glow);
        transform:scale(1);
    }
    50%{
        box-shadow:0 4px 30px var(--pink-glow);
        transform:scale(1.02);
    }
}

@keyframes pulseBlue{
    0%, 100%{
        box-shadow:0 4px 20px var(--blue-glow);
        transform:scale(1);
    }
    50%{
        box-shadow:0 4px 30px var(--blue-glow);
        transform:scale(1.02);
    }
}

@keyframes float{
    0%, 100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-6px);
    }
}

@keyframes download{
    0%{
        transform:translateY(0);
        opacity:1;
    }
    50%{
        transform:translateY(4px);
        opacity:0.7;
    }
    100%{
        transform:translateY(0);
        opacity:1;
    }
}

/* IOS SAFARI FIXES */
@supports (-webkit-touch-callout: none) {
    .card {
        backdrop-filter: none;
        background: rgba(11, 15, 26, 0.92);
    }
}

/* DARK MODE SUPPORT */
@media (prefers-color-scheme: light) {
    :root{
        --bg:#fdf2f8;
        --pink:#ec4899;
        --pink-glow:rgba(236,72,153,.4);
        --blue:#3b82f6;
        --blue-glow:rgba(59,130,246,.3);
        --text:#1f2937;
        --muted:#9d174d;
        --card-bg:rgba(255,255,255,.9);
        --border:rgba(236,72,153,.2);
    }
    
    body{
        background:
          radial-gradient(min(70vw, 600px) min(40vh, 300px) at 50% -5%, #e0e7ff 0%, transparent 70%),
          radial-gradient(min(60vw, 500px) min(30vh, 250px) at 80% 20%, #fce7f3 0%, transparent 70%),
          var(--bg);
    }
    
    .steps{
        background:rgba(249,168,212,.08);
        border-color:rgba(236,72,153,.15);
    }
    
    .step-number{
        background:var(--pink);
        color:white;
    }
}

/* VERY SMALL SCREENS */
@media (max-width:320px){
    body{
        padding:12px;
    }
    
    .card{
        max-width:100%;
        padding:24px 16px;
        border-radius:22px;
    }
    
    .btn{
        padding:14px;
        font-size:0.9rem;
    }
    
    .steps{
        padding:14px;
    }
}

/* LANDSCAPE ORIENTATION */
@media (max-height:500px) and (orientation:landscape){
    body{
        padding:10px;
        align-items:flex-start;
        min-height:auto;
    }
    
    .card{
        margin-top:20px;
        max-width:min(90vw, 500px);
        padding:20px;
    }
    
    p{
        margin-top:8px;
    }
    
    .button-group{
        margin-top:20px;
    }
    
    .steps{
        margin-top:20px;
    }
}

/* HIGH DPI SCREENS */
@media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
    .card{
        border-width:0.5px;
    }
}
</style>
</head>

<body>

<div class="card">
    <div class="emoji">🌸</div>
    <h1>Chào mừng đến Locket Gold</h1>
    <p>
        Để sử dụng tính năng nâng cấp Gold,<br>
        vui lòng thực hiện theo 2 bước bên dưới
    </p>

    <div class="button-group">
        <!-- Bước 1: Cấu hình (GIỜ LÊN TRÊN) -->
        <button class="btn btn-pink" onclick="installConfig()" id="configBtn">
            <span class="btn-icon">⬇️</span>
            <span>Tải cấu hình Mobileconfig</span>
        </button>
        
        <!-- Bước 2: Tải App (GIỜ XUỐNG DƯỚI) -->
        <button class="btn btn-blue" onclick="downloadApp()" id="appBtn">
            <span class="btn-icon">📱</span>
            <span>Tải APP ĐỂ KÍCH HOẠT CẤU HÌNH</span>
        </button>
        
        <div id="loading" class="loading"></div>
    </div>
    
    <div class="steps">
        <!-- Cập nhật lại thứ tự các bước -->
        <div class="step">
            <div class="step-number">1</div>
            <div>
                <strong>Cài đặt cấu hình</strong><br>
                <small>Tải và cài đặt cấu hình trước</small>
            </div>
        </div>
        <div class="step">
            <div class="step-number">2</div>
            <div>
                <strong>Tải ứng dụng VPN</strong><br>
                <small>Sau đó tải app để kích hoạt cấu hình</small>
            </div>
        </div>
    </div>
</div>

<script>
const appBtn = document.getElementById('appBtn');
const configBtn = document.getElementById('configBtn');
const loadingEl = document.getElementById('loading');

// Đổi tên hàm để phù hợp với thứ tự mới
function installConfig(){
    // Thêm hiệu ứng loading cho config button
    configBtn.disabled = true;
    configBtn.style.opacity = '0.8';
    configBtn.style.animation = 'none';
    loadingEl.textContent = 'Đang tải cấu hình...';
    loadingEl.style.display = 'block';
    
    // Thêm hiệu ứng tải xuống
    configBtn.style.animation = 'download 0.5s ease-in-out';
    
    // Mở mobileconfig
    setTimeout(() => {
        window.open(
            'https://webhoangnam.id.vn/dns.mobileconfig',
            '_blank'
        );
        
        // Khôi phục button sau 1.5 giây
        setTimeout(() => {
            configBtn.disabled = false;
            configBtn.style.opacity = '1';
            configBtn.style.animation = 'pulsePink 2.2s infinite';
            loadingEl.style.display = 'none';
            
            // Hiển thị thông báo khuyến khích bước tiếp theo
            showNextStep();
        }, 1500);
    }, 300);
}

function downloadApp(){
    // Thêm hiệu ứng loading cho app button
    appBtn.disabled = true;
    appBtn.style.opacity = '0.8';
    appBtn.style.animation = 'none';
    loadingEl.textContent = 'Đang mở App Store...';
    loadingEl.style.display = 'block';
    
    // Thêm hiệu ứng tải xuống
    appBtn.style.animation = 'download 0.5s ease-in-out';
    
    // Mở link App Store
    setTimeout(() => {
        window.open(
            'https://apps.apple.com/us/app/usa-vpn-private-fast/id6475051414',
            '_blank'
        );
        
        // Khôi phục button sau 1.5 giây
        setTimeout(() => {
            appBtn.disabled = false;
            appBtn.style.opacity = '1';
            appBtn.style.animation = 'pulseBlue 2.2s infinite 0.5s';
            loadingEl.style.display = 'none';
            
            // Hiển thị thông báo hoàn thành
            showCompletion();
        }, 1500);
    }, 300);
}

function showNextStep(){
    // Hiển thị thông báo khuyến khích bước tiếp theo
    const steps = document.querySelector('.steps');
    const notification = document.createElement('div');
    notification.innerHTML = `
        <div style="
            background: rgba(249, 168, 212, 0.1);
            border: 1px solid rgba(249, 168, 212, 0.3);
            border-radius: 12px;
            padding: 12px;
            margin-top: 10px;
            font-size: 0.85rem;
            animation: fadeIn 0.5s ease-out;
        ">
            ✅ Đã tải cấu hình. Vui lòng chuyển sang <strong>Bước 2</strong> để tải app kích hoạt
        </div>
    `;
    
    // Chèn thông báo vào sau button group
    const buttonGroup = document.querySelector('.button-group');
    buttonGroup.parentNode.insertBefore(notification, buttonGroup.nextSibling);
    
    // Tự động xóa thông báo sau 5 giây
    setTimeout(() => {
        notification.style.opacity = '0';
        notification.style.transform = 'translateY(-10px)';
        setTimeout(() => {
            if (notification.parentNode) {
                notification.parentNode.removeChild(notification);
            }
        }, 300);
    }, 5000);
}

function showCompletion(){
    // Hiển thị thông báo hoàn thành
    const steps = document.querySelector('.steps');
    const completion = document.createElement('div');
    completion.innerHTML = `
        <div style="
            background: rgba(147, 197, 253, 0.1);
            border: 1px solid rgba(147, 197, 253, 0.3);
            border-radius: 12px;
            padding: 14px;
            margin-top: 12px;
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        ">
            <div style="font-size: 1.2em; margin-bottom: 8px;">🎉</div>
            <div><strong>Hoàn thành cài đặt!</strong></div>
            <small>Cấu hình đã được kích hoạt. Bây giờ có thể sử dụng tính năng nâng Gold</small>
        </div>
    `;
    
    // Chèn thông báo vào sau steps
    steps.parentNode.insertBefore(completion, steps.nextSibling);
    
    // Tự động xóa thông báo sau 8 giây
    setTimeout(() => {
        completion.style.opacity = '0';
        completion.style.transform = 'translateY(-10px)';
        setTimeout(() => {
            if (completion.parentNode) {
                completion.parentNode.removeChild(completion);
            }
        }, 300);
    }, 8000);
}

// Thêm hiệu ứng khi trang tải xong
document.addEventListener('DOMContentLoaded', () => {
    // Kiểm tra nếu là iOS để hiển thị thông báo đặc biệt
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
    
    if (isIOS && isSafari) {
        console.log('iOS Safari detected - Hiển thị giao diện tối ưu cho iOS');
        
        // Có thể thêm hướng dẫn cụ thể cho iOS nếu cần
        const instructions = document.createElement('div');
        instructions.innerHTML = `
            <div style="
                background: rgba(249, 168, 212, 0.15);
                border: 1px solid rgba(249, 168, 212, 0.3);
                border-radius: 12px;
                padding: 12px;
                margin-top: 16px;
                font-size: 0.8rem;
                text-align: left;
            ">
                <strong>📱 Hướng dẫn cho iOS:</strong><br>
                1. Tải cấu hình → Chọn "Cho phép"<br>
                2. Vào <strong>Cài đặt → Chung → VPN & Quản lý thiết bị</strong><br>
                3. Tìm cấu hình vừa tải và nhấn "Cài đặt"<br>
                4. Sau đó mới tải app để kích hoạt
            </div>
        `;
        
        // Chèn hướng dẫn vào sau steps
        const steps = document.querySelector('.steps');
        if (steps) {
            steps.parentNode.insertBefore(instructions, steps.nextSibling);
        }
    }
    
    // Thêm hiệu ứng khi chạm vào card
    const card = document.querySelector('.card');
    card.addEventListener('touchstart', function() {
        this.style.transform = 'scale(0.99)';
    });
    
    card.addEventListener('touchend', function() {
        this.style.transform = 'scale(1)';
    });
    
    // Tự động tập trung vào nút đầu tiên
    configBtn.focus({ preventScroll: true });
});
</script>

</body>
</html>
