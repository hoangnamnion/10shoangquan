<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Welcome • Locket Gold</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#0b0f1a;
    --pink:#f9a8d4;
    --pink-glow:rgba(249,168,212,.6);
    --text:#fdf2f8;
    --muted:#fbcfe8;
    --card-bg:rgba(255,255,255,.06);
    --border:rgba(255,255,255,.15);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color: transparent;
}

body{
    min-height:100vh;
    font-family:Inter,sans-serif;
    background:
      radial-gradient(min(70vw, 600px) min(40vh, 300px) at 50% -5%, #312e81 0%, transparent 70%),
      radial-gradient(min(60vw, 500px) min(30vh, 250px) at 80% 20%, #831843 0%, transparent 70%),
      var(--bg);
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    overflow-x: hidden;
}

/* CARD */
.card{
    width:100%;
    max-width:min(92vw, 380px);
    padding:clamp(28px, 6vw, 36px) clamp(20px, 4vw, 26px);
    text-align:center;
    background:var(--card-bg);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border:1px solid var(--border);
    border-radius:26px;
    box-shadow:
      0 8px 32px rgba(0,0,0,.3),
      0 0 0 1px rgba(255,255,255,.05),
      inset 0 0 0 1px rgba(255,255,255,.05);
    animation:fadeIn .7s ease-out;
    position:relative;
}

.card::before{
    content:'';
    position:absolute;
    top:0;
    left:0;
    right:0;
    bottom:0;
    border-radius:26px;
    background:linear-gradient(135deg, rgba(249,168,212,.1), transparent 30%);
    pointer-events:none;
}

/* TEXT */
h1{
    font-size:clamp(1.6rem, 5vw, 1.9rem);
    font-weight:700;
    color:var(--pink);
    text-shadow:0 0 20px var(--pink-glow);
    margin-bottom:8px;
    line-height:1.3;
}

p{
    margin-top:12px;
    font-size:clamp(0.85rem, 3vw, 0.95rem);
    color:var(--muted);
    line-height:1.6;
    opacity:0.9;
}

/* EMOJI DECORATION */
.emoji{
    font-size:clamp(2rem, 6vw, 2.5rem);
    display:block;
    margin:clamp(12px, 3vw, 16px) auto;
    animation:float 3s ease-in-out infinite;
}

/* BUTTON */
button{
    margin-top:clamp(24px, 6vw, 32px);
    width:100%;
    padding:clamp(14px, 4vw, 16px);
    font-size:clamp(0.95rem, 3.5vw, 1rem);
    font-weight:700;
    color:#831843;
    background:linear-gradient(135deg,#fce7f3,#f9a8d4);
    border:none;
    border-radius:999px;
    cursor:pointer;
    box-shadow:0 4px 20px var(--pink-glow);
    animation:pulse 2.2s infinite;
    position:relative;
    overflow:hidden;
    transition:all 0.3s ease;
    touch-action:manipulation;
}

button::after{
    content:'';
    position:absolute;
    top:0;
    left:-100%;
    width:100%;
    height:100%;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.2), transparent);
    transition:left 0.5s;
}

button:hover::after{
    left:100%;
}

button:active{
    transform:scale(0.96);
    box-shadow:0 2px 15px var(--pink-glow);
    animation:none;
}

/* LOADING INDICATOR */
.loading{
    display:none;
    margin-top:16px;
    font-size:0.9rem;
    color:var(--muted);
    opacity:0.8;
}

/* ANIMATIONS */
@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px) scale(0.98);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

@keyframes pulse{
    0%, 100%{
        box-shadow:0 4px 20px var(--pink-glow);
        transform:scale(1);
    }
    50%{
        box-shadow:0 4px 30px var(--pink-glow);
        transform:scale(1.02);
    }
}

@keyframes float{
    0%, 100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-6px);
    }
}

@keyframes download{
    0%{
        transform:translateY(0);
        opacity:1;
    }
    50%{
        transform:translateY(4px);
        opacity:0.7;
    }
    100%{
        transform:translateY(0);
        opacity:1;
    }
}

/* IOS SAFARI FIXES */
@supports (-webkit-touch-callout: none) {
    .card {
        backdrop-filter: none;
        background: rgba(11, 15, 26, 0.92);
    }
}

/* DARK MODE SUPPORT */
@media (prefers-color-scheme: light) {
    :root{
        --bg:#fdf2f8;
        --pink:#ec4899;
        --pink-glow:rgba(236,72,153,.4);
        --text:#1f2937;
        --muted:#9d174d;
        --card-bg:rgba(255,255,255,.9);
        --border:rgba(236,72,153,.2);
    }
    
    body{
        background:
          radial-gradient(min(70vw, 600px) min(40vh, 300px) at 50% -5%, #e0e7ff 0%, transparent 70%),
          radial-gradient(min(60vw, 500px) min(30vh, 250px) at 80% 20%, #fce7f3 0%, transparent 70%),
          var(--bg);
    }
    
    button{
        box-shadow:0 4px 20px rgba(236,72,153,.3);
    }
}

/* VERY SMALL SCREENS */
@media (max-width:320px){
    body{
        padding:12px;
    }
    
    .card{
        max-width:100%;
        padding:24px 16px;
        border-radius:22px;
    }
    
    button{
        padding:14px;
        font-size:0.9rem;
    }
}

/* LANDSCAPE ORIENTATION */
@media (max-height:500px) and (orientation:landscape){
    body{
        padding:10px;
        align-items:flex-start;
        min-height:auto;
    }
    
    .card{
        margin-top:20px;
        max-width:min(90vw, 500px);
        padding:20px;
    }
    
    p{
        margin-top:8px;
    }
    
    button{
        margin-top:20px;
    }
}

/* HIGH DPI SCREENS */
@media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
    .card{
        border-width:0.5px;
    }
}
</style>
</head>

<body>

<div class="card">
    <div class="emoji">🌸</div>
    <h1>Xin chào</h1>
    <p>
        Chào mừng bạn đến với <b>Locket Gold</b><br>
        Nhấn nút bên dưới để cài đặt cấu hình<br>
        Tối ưu & nâng cấp trải nghiệm
    </p>

    <button onclick="install()" id="installBtn">
        ⬇️ Tải cấu hình Mobileconfig
    </button>
    
    <div id="loading" class="loading">
        Đang tải cấu hình...
    </div>
</div>

<script>
const installBtn = document.getElementById('installBtn');
const loadingEl = document.getElementById('loading');

function install(){
    // Thêm hiệu ứng loading
    installBtn.disabled = true;
    installBtn.style.opacity = '0.8';
    installBtn.style.animation = 'none';
    loadingEl.style.display = 'block';
    
    // Thêm hiệu ứng tải xuống
    installBtn.style.animation = 'download 0.5s ease-in-out';
    
    // Mở mobileconfig
    setTimeout(() => {
        window.open(
            'https://hoangquann.netlify.app/dns.mobileconfig',
            '_blank'
        );
        
        // Khôi phục button sau 1.5 giây
        setTimeout(() => {
            installBtn.disabled = false;
            installBtn.style.opacity = '1';
            installBtn.style.animation = 'pulse 2.2s infinite';
            loadingEl.style.display = 'none';
        }, 1500);
    }, 300);
}

// Thêm hiệu ứng khi trang tải xong
document.addEventListener('DOMContentLoaded', () => {
    // Kiểm tra nếu là iOS để hiển thị thông báo đặc biệt
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
    
    if (isIOS && isSafari) {
        // Có thể thêm thông báo cho iOS Safari nếu cần
        console.log('iOS Safari detected');
    }
    
    // Thêm hiệu ứng khi chạm vào card
    const card = document.querySelector('.card');
    card.addEventListener('touchstart', function() {
        this.style.transform = 'scale(0.99)';
    });
    
    card.addEventListener('touchend', function() {
        this.style.transform = 'scale(1)';
    });
});
</script>

</body>
</html>
